name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build looks up the commit that last changed wasm/ (the
          # engine's address on jsDelivr), which needs the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # aksharamukha-v5.js.br must be the compressed form of the committed
      # aksharamukha-v5.js - anyone self-hosting with pre-compressed files
      # would otherwise serve older code than the .js.
      - name: Check aksharamukha-v5.js.br matches aksharamukha-v5.js
        run: >
          node -e "const z = require('zlib'), fs = require('fs');
          if (!z.brotliDecompressSync(fs.readFileSync('aksharamukha-v5.js.br')).equals(fs.readFileSync('aksharamukha-v5.js'))) {
          console.error('aksharamukha-v5.js.br is out of date - run node build-scripts/build-web-plugin-v5.js without --skip-compression and commit both files.');
          process.exit(1) }"

      # Validates the build pipeline still works standalone (no monorepo
      # checked out here - it should warn and fall back to the committed
      # src/script-data.generated.js, not fail) and that the result is at
      # least syntactically valid, before running the full browser suite
      # against whatever aksharamukha-v5.js is actually committed.
      - name: Rebuild (standalone, no monorepo) and syntax-check
        run: |
          node build-scripts/build-web-plugin-v5.js --skip-compression
          node -c aksharamukha-v5.js
          # The committed bundle must be exactly what the build produces from
          # the committed sources - including the engine commit baked in.
          git diff --exit-code aksharamukha-v5.js || (echo "::error::aksharamukha-v5.js is out of date - run the build and commit it." && exit 1)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tests hit the live hosted API (aksharamukha-plugin.appspot.com) as
      # part of engine=api - these are integration tests, not isolated
      # unit tests, so a transient network/API issue can fail this step
      # independent of the plugin's own code. See README-v5-plugin.md.
      - name: Run tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
